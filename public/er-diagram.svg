<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
<title id="title">Blood Donation Management System ER Diagram</title><desc id="desc">Entity relationship diagram showing eleven entities and their one-to-many relationships.</desc>
<defs><style>
 .bg{fill:#f8f7f4}.title{font:800 39px Arial,sans-serif;fill:#232833}.sub{font:16px Arial,sans-serif;fill:#717887}.card{fill:#fff;stroke:#dfe3e9;stroke-width:2;rx:14}.head{fill:#c93d48}.head2{fill:#303b50}.head3{fill:#19846d}.head4{fill:#cc8129}.head5{fill:#7254a0}.htext{font:700 18px Arial,sans-serif;fill:white}.field{font:15px Arial,sans-serif;fill:#303744}.key{font-weight:700;fill:#c53d48}.line{fill:none;stroke:#788395;stroke-width:2.3}.rel{font:700 13px Arial,sans-serif;fill:#596477}.note{font:14px Arial,sans-serif;fill:#667080}
</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9" fill="none" stroke="#788395" stroke-width="1.5"/></marker></defs>
<rect class="bg" width="1800" height="1240"/>
<text class="title" x="64" y="72">Blood Donation Management System</text><text class="sub" x="64" y="104">Entity Relationship Diagram · logical design for the MongoDB implementation</text>
<!-- Relationship connectors behind entities -->
<g class="line" marker-end="url(#arrow)">
 <!-- One blood group may be assigned to many donors. -->
 <path d="M360 260 H430 V450 H500"/>
 <!-- A donor can have many donation and eligibility records. -->
 <path d="M360 445 H425 V205 H500"/><path d="M360 505 H500"/>
 <!-- A bank can receive donations and maintain one inventory row per group. -->
 <path d="M360 720 H450 V205 H500"/><path d="M360 775 H500"/>
 <!-- A hospital can submit multiple requests; each request points to one bank, group and admin. -->
 <path d="M360 1025 H950 V540 H1060"/><path d="M360 830 H930 V485 H1060"/>
 <path d="M360 315 H455 V765 H500"/>
 <!-- An administrator reviews requests; a request can have multiple distributions. -->
 <path d="M1205 300 V380"/><path d="M1205 590 V660"/>
</g>
<!-- left column -->
<g transform="translate(70 150)"><rect class="card" width="290" height="220"/><path class="head" d="M14 0h262a14 14 0 0 1 14 14v39H0V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">BLOOD_GROUP</text><text class="field" x="18" y="82"><tspan class="key">PK</tspan><tspan>  blood_group_id</tspan></text><text class="field" x="18" y="110">blood_group_name (unique)</text><text class="field" x="18" y="138">A+, A-, B+, B-, O+, O-, AB+, AB-</text></g>
<g transform="translate(70 390)"><rect class="card" width="290" height="230"/><path class="head2" d="M14 0h262a14 14 0 0 1 14 14v39H0V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">DONOR</text><text class="field" x="18" y="82"><tspan class="key">PK</tspan><tspan>  donor_id</tspan></text><text class="field" x="18" y="110"><tspan class="key">FK</tspan><tspan>  blood_group_id</tspan></text><text class="field" x="18" y="138">name, date_of_birth, gender</text><text class="field" x="18" y="166">phone (unique), email (unique)</text><text class="field" x="18" y="194">address</text></g>
<g transform="translate(70 680)"><rect class="card" width="290" height="190"/><path class="head5" d="M14 0h262a14 14 0 0 1 14 14v39H0V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">BLOOD_BANK</text><text class="field" x="18" y="82"><tspan class="key">PK</tspan><tspan>  bank_id</tspan></text><text class="field" x="18" y="110">bank_name, address, phone</text></g>
<g transform="translate(70 930)"><rect class="card" width="290" height="190"/><path class="head5" d="M14 0h262a14 14 0 0 1 14 14v39H0V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">HOSPITAL</text><text class="field" x="18" y="82"><tspan class="key">PK</tspan><tspan>  hospital_id</tspan></text><text class="field" x="18" y="110">hospital_name, address, phone</text></g>
<!-- middle column -->
<g transform="translate(500 100)"><rect class="card" width="290" height="210"/><path class="head3" d="M14 0h262a14 14 0 0 1 14 14v39H0V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">DONATION</text><text class="field" x="18" y="82"><tspan class="key">PK</tspan><tspan>  donation_id</tspan></text><text class="field" x="18" y="110"><tspan class="key">FK</tspan><tspan>  donor_id, bank_id</tspan></text><text class="field" x="18" y="138">donation_date, units_donated</text></g>
<g transform="translate(500 380)"><rect class="card" width="290" height="210"/><path class="head3" d="M14 0h262a14 14 0 0 1 14 14v39H0V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">ELIGIBILITY_CHECK</text><text class="field" x="18" y="82"><tspan class="key">PK</tspan><tspan>  check_id</tspan></text><text class="field" x="18" y="110"><tspan class="key">FK</tspan><tspan>  donor_id</tspan></text><text class="field" x="18" y="138">check_date, eligibility_status</text></g>
<g transform="translate(500 660)"><rect class="card" width="290" height="210"/><path class="head3" d="M14 0h262a14 14 0 0 1 14 14v39H0V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">BLOOD_INVENTORY</text><text class="field" x="18" y="82"><tspan class="key">PK</tspan><tspan>  inventory_id</tspan></text><text class="field" x="18" y="110"><tspan class="key">FK</tspan><tspan>  bank_id, blood_group_id</tspan></text><text class="field" x="18" y="138">units_available ≥ 0</text><text class="field" x="18" y="166">unique (bank_id, blood_group_id)</text></g>
<g transform="translate(1060 100)"><rect class="card" width="290" height="200"/><path class="head4" d="M14 0h262a14 14 0 0 1 14 14v39H0V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">ADMIN</text><text class="field" x="18" y="82"><tspan class="key">PK</tspan><tspan>  admin_id</tspan></text><text class="field" x="18" y="110">name, email (unique)</text><text class="field" x="18" y="138">password_hash</text></g>
<g transform="translate(1060 380)"><rect class="card" width="290" height="210"/><path class="head4" d="M14 0h262a14 14 0 0 1 14 14v39H0V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">BLOOD_REQUEST</text><text class="field" x="18" y="82"><tspan class="key">PK</tspan><tspan>  request_id</tspan></text><text class="field" x="18" y="110"><tspan class="key">FK</tspan><tspan>  hospital_id, bank_id</tspan></text><text class="field" x="18" y="138"><tspan class="key">FK</tspan><tspan>  blood_group_id, admin_id</tspan></text><text class="field" x="18" y="166">units_required, request_date, status</text></g>
<g transform="translate(1060 660)"><rect class="card" width="290" height="210"/><path class="head3" d="M14 0h262a14 14 0 0 1 14 14v39H0V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">DISTRIBUTION</text><text class="field" x="18" y="82"><tspan class="key">PK</tspan><tspan>  distribution_id</tspan></text><text class="field" x="18" y="110"><tspan class="key">FK</tspan><tspan>  request_id</tspan></text><text class="field" x="18" y="138">units_distributed</text><text class="field" x="18" y="166">distribution_date</text></g>
<!-- note and relationships legend -->
<g transform="translate(1510 360)"><rect class="card" width="230" height="300"/><path class="head2" d="M14 0h202a14 14 0 0 1 14 14v39h-230V14A14 14 0 0 1 14 0"/><text class="htext" x="18" y="34">RELATIONSHIPS</text><text class="field" x="18" y="84">Blood group 1—M donor</text><text class="field" x="18" y="114">Donor 1—M donation</text><text class="field" x="18" y="144">Donor 1—M eligibility</text><text class="field" x="18" y="174">Bank 1—M donation</text><text class="field" x="18" y="204">Bank/group 1—M inventory</text><text class="field" x="18" y="234">Hospital/bank/admin 1—M request</text><text class="field" x="18" y="264">Request 1—M distribution</text></g>
<text class="note" x="64" y="1190">PK = primary key · FK = foreign key in the logical relational design · MongoDB stores related identifiers as ObjectId references.</text>
</svg>
